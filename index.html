<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>FaceUp</title>
  </head>
  <body>
    <main class="camera-app">
      <video id="video" autoplay playsinline muted aria-label="Изображение с фронтальной камеры"></video>
      <div class="shade shade-top"></div><div class="shade shade-bottom"></div>
      <section class="header"><h1>FaceUp <span class="version">v1.4.0</span></h1><button id="install" hidden>Установить</button></section>
      <section id="startPanel" class="start-panel">
        <p>Откройте фронтальную камеру</p>
        <button id="start" class="primary">Включить камеру</button>
        <small>Камера доступна только через HTTPS.</small>
      </section>
      <section id="controls" class="controls" hidden>
        <label for="zoom">Зум <output id="zoomValue">1.0×</output></label>
        <input id="zoom" type="range" min="1" max="10" value="1" step="0.1" />
        <div class="quick-zoom" aria-label="Быстрый выбор зума">
          <button data-zoom="1">1×</button><button data-zoom="2">2×</button><button data-zoom="5">5×</button><button data-zoom="10">10×</button>
        </div>
        <div class="capture-row">
          <button id="lastPhoto" class="photo-thumb" hidden aria-label="Открыть последний снимок"><img id="lastPhotoImage" alt="Последний снимок" /></button>
          <button id="capture" class="shutter" aria-label="Сделать снимок"><span></span></button>
          <span class="capture-spacer" aria-hidden="true"></span>
        </div>
        <button id="switch" class="secondary">Сменить камеру</button>
      </section>
      <p id="message" class="message" role="alert"></p>
      <section id="viewer" class="viewer" hidden aria-label="Просмотр снимка">
        <header class="viewer-header"><button id="backToCamera">‹ Назад</button><span>Снимок</span></header>
        <img id="previewImage" alt="Сделанный снимок" />
        <footer class="viewer-actions">
          <a id="downloadPhoto" class="button-link" download>Сохранить файл</a>
          <button id="sharePhoto">Поделиться</button>
          <button id="deletePhoto" class="danger">Удалить</button>
        </footer>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
